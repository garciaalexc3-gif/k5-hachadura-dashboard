name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths: ['index.html', 'general.html', 'assets/**', 'laminas/**', 'imagenes/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar snapshot y archivos
        run: |
          node --check assets/app.js
          python - <<'PY'
          import pathlib,json
          p=pathlib.Path('.')
          d=json.loads((p/'assets/datos.json').read_text())
          assert len(d['laminas'])==31
          assert len({r['uid'] for r in d['parcelas']})==len(d['parcelas'])
          for image in d['imagenes']: assert (p/image['src']).is_file()
          for sheet in d['laminas']: assert (p/'laminas'/f"{sheet['codigo']}.html").is_file()
          print('Snapshot, IDs, fotografías y 31 vistas verificados.')
          PY
      - uses: actions/configure-pages@v5
      - name: Preparar únicamente el sitio público
        run: |
          mkdir -p _site
          cp index.html general.html .nojekyll _site/
          cp -R assets laminas imagenes _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar disponibilidad y contenido
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import concurrent.futures,hashlib,os,pathlib,time,urllib.request,json
          p=pathlib.Path('.')
          d=json.loads((p/'assets/datos.json').read_text())
          files=['index.html','general.html','assets/app.js','assets/data.js','assets/datos.json','assets/style.css']+[f"laminas/{l['codigo']}.html" for l in d['laminas']]+[i['src'] for i in d['imagenes']]
          def verify(rel):
              want=hashlib.sha256(p.joinpath(rel).read_bytes()).digest()
              for attempt in range(8):
                  try:
                      url=os.environ['SITE_URL'].rstrip('/')+'/'+rel+'?verify='+os.environ['GITHUB_SHA']+str(attempt)
                      with urllib.request.urlopen(url,timeout=20) as r:
                          assert r.status==200 and hashlib.sha256(r.read()).digest()==want
                      return rel
                  except Exception:
                      if attempt==7: raise
                      time.sleep(5)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex: verified=list(ex.map(verify,files))
          print('WEB_OK',len(verified),'recursos')
          PY
