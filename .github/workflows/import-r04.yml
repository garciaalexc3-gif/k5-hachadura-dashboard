name: Integrar y publicar R04
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-r04.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  integrar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recuperar y validar paquete público R04
        run: |
          curl --fail --location --retry 2 'https://at.adobe.com/MCL0FqSexSYEfJOu' --output "$RUNNER_TEMP/r04.zip"
          echo "c51636d1d3e56ac38c4a2ca81b2865cbcb39f9a43e7e24735b35033b5618da01  $RUNNER_TEMP/r04.zip" | sha256sum -c -
          python - <<'PY'
          import os,zipfile,pathlib,json
          root=pathlib.Path.cwd()
          with zipfile.ZipFile(os.environ['RUNNER_TEMP']+'/r04.zip') as z:
              for n in z.namelist():
                  p=pathlib.PurePosixPath(n)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert n in ('index.html','general.html','.nojekyll') or p.parts[0] in ('assets','laminas','imagenes')
              z.extractall(root)
          d=json.loads((root/'assets/datos.json').read_text())
          assert d['version']=='R04'
          assert tuple(len(d[k]) for k in ('parcelas','comparables','equipamientos','laminas','imagenes'))==(1994,19,11,31,28)
          assert len({p['uid'] for p in d['parcelas']})==1994
          assert sum(p['uso']!='SIN CLASIFICAR' for p in d['parcelas'])==152
          assert abs(sum(p['area'] for p in d['parcelas'])-40678864.75)<0.01
          missing=[]
          for family in ('parcelas','comparables','equipamientos'):
              for r in d[family]:
                  assert not {'propietario','matricula','contacto','id_abogado','parcela_abogado'}.intersection(r)
                  if r['lon'] is None or r['lat'] is None:
                      missing.append(r.get('id',r.get('uid')))
                      assert r['x'] is None and r['y'] is None
                  else:
                      assert -91<r['lon']<-88 and 12<r['lat']<15
          assert missing==['EI-010'],missing
          assert any(q['id']=='EI-010' and q['campo']=='coordenadas' for q in d['control'])
          for im in d['imagenes']: assert (root/im['src']).is_file()
          ids={p['uid'] for p in d['parcelas']}
          for l in d['laminas']:
              assert (root/'laminas'/f"{l['codigo']}.html").is_file()
              assert set(l['parcelas_uid']) <= ids
              assert len(l['parcelas_uid'])==len(set(l['parcelas_uid']))
          print('DATOS_OK: 1994 UID; 31 ámbitos; 28 fotos; 1 coordenada inválida preservada y documentada.')
          PY
      - name: Verificar código y guardar R04
        run: |
          node --check assets/app.js
          node --check assets/data.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html general.html assets laminas imagenes .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m 'R04 integrada: matrices, imágenes originales, cartografía y gráficos'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - name: Preparar solamente sitio público
        run: |
          mkdir -p _site
          cp index.html general.html .nojekyll _site/
          cp -R assets laminas imagenes _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar R04
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar publicación real de 65 recursos
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os,urllib.request,json,time,pathlib,hashlib,concurrent.futures
          base=os.environ['SITE'].rstrip('/')+'/'
          d=json.loads(pathlib.Path('assets/datos.json').read_text())
          urls=['index.html','general.html','assets/app.js','assets/data.js','assets/style.css','assets/datos.json']+[f"laminas/{l['codigo']}.html" for l in d['laminas']]+[i['src'] for i in d['imagenes']]
          def verify(rel):
              expected=hashlib.sha256(pathlib.Path(rel).read_bytes()).digest()
              for attempt in range(12):
                  try:
                      with urllib.request.urlopen(base+rel+'?verify=R04-'+str(attempt),timeout=20) as response:
                          assert response.status==200
                          assert hashlib.sha256(response.read()).digest()==expected
                      return rel
                  except Exception:
                      if attempt==11: raise
                      time.sleep(5)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex: checked=list(ex.map(verify,urls))
          assert len(checked)==65
          print('WEB_OK: 65 recursos, 31 HTML y 28 fotografías, HTTP 200 y SHA256 coincidente.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('## R04 publicada y verificada\n1994 registros únicos · 19 comparables · 11 equipamientos (10 coordenadas válidas) · 31 HTML · 28 fotografías.\n65 recursos HTTP 200 y SHA256 correctos.\n')
          PY
